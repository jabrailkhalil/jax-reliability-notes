name: Reproduce JAX cases

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  before-and-after:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install pinned upstream baseline
        run: |
          git clone --filter=blob:none https://github.com/jax-ml/jax.git .lab/jax
          git -C .lab/jax checkout 004eda6fcb36dd11d61ea9fa5fa2249a1810d604
          python -m pip install -r requirements-demo.txt -e .lab/jax
      - name: Verify both baseline bugs
        run: |
          python examples/keyword_forwarding.py --expect baseline
          python examples/uneven_collectives.py --expect baseline
      - name: Apply submitted fixes
        run: |
          git -C .lab/jax apply ../../patches/keyword-forwarding.patch
          git -C .lab/jax apply ../../patches/uneven-collectives.patch
      - name: Verify both fixed examples
        run: |
          python examples/keyword_forwarding.py --expect fixed
          python examples/uneven_collectives.py --expect fixed

  generalized-eigh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install source with generalized eigenproblems
        run: |
          git clone --filter=blob:none https://github.com/jax-ml/jax.git .lab/generalized-jax
          git -C .lab/generalized-jax checkout 15998e8040d07995ac5dcc4643333e1b88e8c047
          python -m pip install -r requirements-lda.txt .lab/generalized-jax
      - name: Check SciPy references, identities, JIT, vmap and gradients
        run: |
          python examples/generalized_eigh.py
          python examples/generalized_eigh.py --x64
      - name: Check Fisher LDA, batched ridge values, gradients and plot generation
        run: |
          python examples/differentiable_lda.py
          python examples/differentiable_lda.py --x64 --plot-dir .lab/lda-plot

  clipping-meta-gradients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install pinned vector lab dependencies
        run: python -m pip install -r requirements-clipping.txt
      - name: Check baseline failures and analytic fixed gradients
        run: python examples/clipping_meta_gradients.py

  grain-shutdown:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch immutable Grain source revisions
        shell: bash
        run: |
          git init .lab/grain
          git -C .lab/grain fetch --depth=1 https://github.com/google/grain.git 7e36b7231574d0f9ab106f903a8d832f58157594
          git -C .lab/grain fetch --depth=1 https://github.com/jabrailkhalil/grain.git b24133c928899e86b649d624bea32c3e494483e4
      - name: Verify the five baseline failures and seven controls
        run: python examples/grain_shutdown.py --source .lab/grain --expect baseline
      - name: Verify all twelve fixed cases including real final GC
        run: python examples/grain_shutdown.py --source .lab/grain --expect fixed
