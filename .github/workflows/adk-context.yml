name: Reproduce ADK context boundaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  before-and-after:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: '-race'
          - os: windows-latest
            race: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      OTEL_SDK_DISABLED: 'true'
      RACE: ${{ matrix.race }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l examples/adk-context/main.go)"
      - name: Fetch exact upstream parent and accepted merge
        shell: bash
        run: |
          git init .lab/adk-go
          git -C .lab/adk-go fetch --depth=1 https://github.com/google/adk-go.git a1603c7f179af285b08ef4f03e757a6deb0630b9
          git -C .lab/adk-go fetch --depth=1 https://github.com/google/adk-go.git 6caa3b853ea4d179124f089daf6f39498dc93425
      - name: Execute both revisions and reject the opposite expectation
        shell: bash
        run: |
          set -euo pipefail
          for mode in baseline fixed; do
            if [ "$mode" = baseline ]; then
              revision=a1603c7f179af285b08ef4f03e757a6deb0630b9
              wrong=fixed
            else
              revision=6caa3b853ea4d179124f089daf6f39498dc93425
              wrong=baseline
            fi
            git -C .lab/adk-go checkout --detach "$revision"
            (
              cd .lab/adk-go
              go vet -mod=readonly ../../examples/adk-context/main.go
              go build $RACE -mod=readonly -o ../adk-context-lab.exe ../../examples/adk-context/main.go
            )
            .lab/adk-context-lab.exe --expect "$mode" > ".lab/adk-$mode.json"
            set +e
            .lab/adk-context-lab.exe --expect "$wrong" > ".lab/adk-$mode-wrong-expectation.json"
            result=$?
            set -e
            test "$result" -eq 1
            set +e
            .lab/adk-context-lab.exe --expect invalid > .lab/adk-invalid.json
            result=$?
            set -e
            test "$result" -eq 2
            test ! -s .lab/adk-invalid.json
            git -C .lab/adk-go diff --exit-code -- go.mod go.sum
          done
          python examples/adk-context/check_results.py .lab
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: adk-context-${{ matrix.os }}
          path: .lab/adk-*.json
