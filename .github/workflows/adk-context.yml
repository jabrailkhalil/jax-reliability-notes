name: Reproduce ADK context boundaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  before-and-after:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: '--race'
          - os: windows-latest
            race: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      OTEL_SDK_DISABLED: 'true'
      RACE: ${{ matrix.race }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Execute both revisions and reject the opposite expectation
        shell: bash
        run: python examples/adk-context/run.py $RACE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: adk-context-${{ matrix.os }}
          path: .lab/adk-*.json
          include-hidden-files: true
          if-no-files-found: error
